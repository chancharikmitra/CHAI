[project]
name = "chai"
version = "0.1.0"
description = "CHAI: Video captioning evaluation pipeline"
authors = [
  { name = "Chancharik Mitra", email = "cmitra@cs.cmu.edu" },
  { name = "Zhiqiu Lin", email = "zhiqiul@cs.cmu.edu" },
  { name = "Siyuan Cen", email = "siyuancen096@gmail.com" }
]
dependencies = [
  "python-dotenv",
  "t2v_metrics @ git+https://github.com/chancharikmitra/t2v_metrics.git@qwen3-vl",
  "transformers>=4.57.0,<4.58.0"
]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]